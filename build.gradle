plugins {
    id 'java'
    id("io.qameta.allure") version "4.2.0"
}

def allureVersion = "2.35.1"

allure {
    report {
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.codeborne:selenide:7.18.0'
    testImplementation 'net.datafaker:datafaker:2.7.0'

    testImplementation "io.qameta.allure:allure-jupiter:$allureVersion"
    testImplementation "io.qameta.allure:allure-selenide:$allureVersion"


    testImplementation "org.aspectj:aspectjweaver:1.9.22.1"
}

test {
    useJUnitPlatform()
}

tasks.register('positiveTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags "pozitive"
    }
}